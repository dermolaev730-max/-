<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кошелек</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== 1. СТИЛИ: цвета заданы переменными, темная тема включается автоматически ===== */
:root {
  --bg: #eef2f6; --card: #ffffff; --text: #14213d; --muted: #66728a;
  --line: #d9e0ea; --accent: #3550e8; --accent-text: #ffffff;
  --income: #17805a; --expense: #c23b2a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1624; --card: #182136; --text: #eaf0ff; --muted: #98a4bf;
    --line: #2a3550; --accent: #7b8fff; --accent-text: #0f1624;
    --income: #4cc794; --expense: #ff8a78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1624; --card: #182136; --text: #eaf0ff; --muted: #98a4bf;
  --line: #2a3550; --accent: #7b8fff; --accent-text: #0f1624;
  --income: #4cc794; --expense: #ff8a78; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  line-height: 1.5;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); margin: 8px 0 0; }
.balance { font-size: clamp(2.4rem, 11vw, 3.6rem); font-weight: 800; margin: 0 0 20px; letter-spacing: -0.02em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.row > * { flex: 1; min-width: 0; }
input {
  width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
  padding: 12px; color: var(--accent-text);
}
.btn-in { background: var(--income); }
.btn-out { background: var(--expense); }
.btn-in, .btn-out { color: #fff; }
.msg { min-height: 1.4em; margin: 6px 0 0; font-size: .9rem; color: var(--expense); }
h2 { font-size: 1rem; margin: 0 0 8px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.note { font-weight: 600; }
.date { font-size: .8rem; color: var(--muted); }
.sum { font-weight: 800; white-space: nowrap; }
.sum.in { color: var(--income); }
.sum.out { color: var(--expense); }
.empty { color: var(--muted); margin: 0; }
.clear { background: transparent; color: var(--muted); padding: 6px 0; font-weight: 400; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <!-- ===== 2. РАЗМЕТКА (HTML): что видит пользователь ===== -->
  <h1>Баланс</h1>
  <p class="balance" id="balance">0,00 ₽</p>

  <section class="card">
    <div class="row">
      <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Сумма" aria-label="Сумма">
      <input id="note" type="text" maxlength="40" placeholder="Комментарий" aria-label="Комментарий">
    </div>
    <div class="row">
      <button class="btn-in" id="btnIn">Пополнить</button>
      <button class="btn-out" id="btnOut">Потратить</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="card">
    <h2>История операций</h2>
    <ul id="list"></ul>
    <button class="clear" id="btnClear">Очистить историю</button>
  </section>
</main>

<script>
/* ===== 3. ЛОГИКА (JavaScript): три простые части ===== */

// Часть А. Данные: баланс считается из списка операций
let operations = [];

// Часть Б. Хранение: сохраняем в браузере, чтобы данные не пропадали
function save() {
  try { localStorage.setItem("wallet", JSON.stringify(operations)); } catch (e) {}
}
function load() {
  try { operations = JSON.parse(localStorage.getItem("wallet")) || []; } catch (e) { operations = []; }
}

// Часть В. Действия: добавить операцию и перерисовать экран
function addOperation(type) {
  const amount = parseFloat(document.getElementById("amount").value);
  const note = document.getElementById("note").value.trim();

  if (!(amount > 0)) return showMessage("Введите сумму больше нуля.");
  if (type === "out" && amount > getBalance()) return showMessage("Недостаточно средств.");

  operations.unshift({
    type: type,
    amount: amount,
    note: note || (type === "in" ? "Пополнение" : "Расход"),
    date: new Date().toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" })
  });
  save();
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  showMessage("");
  render();
}

// Баланс = все пополнения минус все траты
function getBalance() {
  return operations.reduce((sum, op) => sum + (op.type === "in" ? op.amount : -op.amount), 0);
}

function money(n) {
  return n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₽";
}

function showMessage(text) {
  document.getElementById("msg").textContent = text;
}

// Рисуем баланс и список на экране
function render() {
  document.getElementById("balance").textContent = money(getBalance());
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (operations.length === 0) {
    list.innerHTML = '<p class="empty">Операций пока нет. Добавьте первую выше.</p>';
    return;
  }
  operations.forEach(function (op) {
    const li = document.createElement("li");
    const left = document.createElement("div");
    const note = document.createElement("div");
    const date = document.createElement("div");
    const sum = document.createElement("div");
    note.className = "note"; note.textContent = op.note;
    date.className = "date"; date.textContent = op.date;
    sum.className = "sum " + op.type;
    sum.textContent = (op.type === "in" ? "+" : "−") + money(op.amount);
    left.append(note, date);
    li.append(left, sum);
    list.append(li);
  });
}

// Подключаем кнопки
document.getElementById("btnIn").onclick = function () { addOperation("in"); };
document.getElementById("btnOut").onclick = function () { addOperation("out"); };
document.getElementById("btnClear").onclick = function () {
  if (confirm("Удалить всю историю и обнулить баланс?")) { operations = []; save(); render(); }
};

load();
render();
</script>
</body>
</html>
